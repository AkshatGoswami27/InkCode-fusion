services:
  - type: web_service
    name: inkcode-fusion-server
    env: docker
    region: oregon
    plan: starter
    dockerfilePath: apps/server/Dockerfile
    startCommand: node index.js
    envVars:
      - key: PORT
        value: "4000"
  - type: static_site
    name: inkcode-fusion-web
    region: oregon
    plan: starter
    root: apps/web
    buildCommand: npm install && npm run build
    publishPath: build
    envVars:
      - key: REACT_APP_SOCKET_URL
        value: "https://inkcode-fusion-server.onrender.com"
